<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>Smart Light Pro</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #09090b;
      --card: #1c1c1e;
      --accent: #10b981;
      --text: #ffffff;
      --subtext: #a1a1aa;
      --border: #2c2c2e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding-bottom: 90px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: #27272a;
      color: var(--subtext);
    }
    .badge.ok {
      background: rgba(16, 185, 129, 0.18);
      color: var(--accent);
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .manual-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-dot {
      height: 10px;
      width: 10px;
      background: #3f3f46;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .status-dot.on {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .label {
      font-size: 0.75rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 1.1px;
      font-weight: 600;
    }
    .switch {
      position: relative;
      width: 60px;
      height: 32px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #3f3f46;
      transition: 0.3s;
      border-radius: 32px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 4px;
      bottom: 4px;
      background: #fff;
      transition: 0.3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background: var(--accent);
    }
    input:checked + .slider:before {
      transform: translateX(28px);
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #2c2c2e;
      border: 1px solid #3f3f46;
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      margin-top: 8px;
      box-sizing: border-box;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 13px;
      width: 100%;
      border-radius: 14px;
      font-weight: bold;
      margin-top: 14px;
      cursor: pointer;
    }
    .btn.secondary {
      background: #3f3f46;
    }
    .nav {
      position: fixed;
      bottom: 20px;
      width: calc(100% - 40px);
      max-width: 380px;
      background: rgba(28, 28, 30, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .nav-item {
      color: var(--subtext);
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }
    .nav-item.active {
      color: var(--accent);
    }
    .hint {
      font-size: 0.78rem;
      color: var(--subtext);
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="app-container" id="mainView">
    <div class="header">
      <h2 style="margin: 0;">Smart Light</h2>
      <span id="connBadge" class="badge">Disconnected</span>
    </div>

    <div class="card manual-section">
      <div>
        <span class="status-dot" id="statusDot"></span>
        <span style="font-weight: 600;" id="stateLabel">Light is OFF</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="manualToggle" onchange="onToggleChanged()" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <div class="label">Quick Actions</div>
      <div style="display: flex; gap: 10px; margin-top: 12px;">
        <button class="btn" style="margin-top: 0;" onclick="setLight(true)">Turn ON</button>
        <button class="btn secondary" style="margin-top: 0;" onclick="setLight(false)">Turn OFF</button>
      </div>
      <p class="hint" id="lastSync">Last updated: never</p>
    </div>
  </div>

  <div class="app-container" id="settingsView" style="display: none;">
    <h2 style="margin-bottom: 20px;">Adafruit IO Settings</h2>
    <div class="card">
      <div class="label">Feed & Credentials (Stored Locally)</div>
      <input type="text" id="aioUser" placeholder="Adafruit IO Username" />
      <input type="text" id="aioFeed" placeholder="Feed Key (e.g. light)" />
      <input type="password" id="aioKey" placeholder="Adafruit IO Active Key (aio_...)" />
      <button class="btn" onclick="saveSettings()">Save Settings</button>
      <p class="hint">
        Saved in your browser's <code>localStorage</code> on this device. Refreshing or polling every few seconds syncs with feed <code>username/feeds/feed</code>.
      </p>
    </div>
  </div>

  <div class="nav">
    <div class="nav-item active" id="navMain" onclick="switchTab('main')">Controls</div>
    <div class="nav-item" id="navSettings" onclick="switchTab('settings')">Settings</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
